syntax = "proto3";

package layout.v1;

option go_package = "nexis.run/nexa-layout/pb/layout;layout";
option java_multiple_files = true;
option java_package = "pb.layout";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  uint64 id = 1;
  string username = 2;
  uint32 role = 3;
  string token = 4;
}

service UserService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
}
