components:
    schemas:
        dto.UserInfoResponse:
            properties:
                id:
                    description: 用户ID
                    type: integer
                role:
                    description: 角色
                    type: integer
                username:
                    description: 用户名
                    type: string
            type: object
        dto.UserLoginRequest:
            properties:
                password:
                    type: string
                username:
                    type: string
            required:
                - password
                - username
            type: object
        dto.UserLoginResponse:
            properties:
                id:
                    description: 用户ID
                    type: integer
                role:
                    description: 角色
                    type: integer
                token:
                    description: token
                    type: string
                username:
                    description: 用户名
                    type: string
            type: object
externalDocs:
    description: ""
    url: ""
info:
    title: layout API
    version: "1.0"
openapi: 3.1.0
paths:
    /login:
        post:
            operationId: UserLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/dto.UserLoginRequest'
                            description: 请求参数
                            summary: request
                description: 请求参数
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.UserLoginResponse'
                    description: 请求成功
            summary: 用户登录
            tags:
                - User - 用户
    /user/info:
        get:
            operationId: UserInfo
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.UserInfoResponse'
                    description: 请求成功
            summary: 获取用户信息
            tags:
                - User - 用户
servers:
    - description: '>>[ENV]<< BaseURL'
      url: '>>[BASE_URL]<<'
